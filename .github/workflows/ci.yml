name: Ventoy CI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Cancel any in-progress run for the same ref so stale builds don't queue up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Read the version BEFORE the build runs — the build may modify grub.cfg.
      # grub.cfg contains:  set VENTOY_VERSION="1.1.16"
      - name: Extract Ventoy version
        id: version
        run: |
          VER=$(grep 'set VENTOY_VERSION=' INSTALL/grub/grub.cfg \
                | awk -F'"' '{print $2}' \
                | head -1)
          if [ -z "$VER" ]; then
            echo "::error::Could not extract VENTOY_VERSION from grub.cfg"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Ventoy version: $VER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Cache the Docker layer store between runs.
      # Key rotates when Dockerfile changes; older keys used as fallback.
      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to  type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load -t ventoy-ventoy .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # --abort-on-container-exit ensures the step fails if the container exits non-zero
      - name: Run build inside container
        run: docker compose up --abort-on-container-exit --exit-code-from ventoy

      # ── Artifacts ──────────────────────────────────────────────────────────

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ventoy-${{ steps.version.outputs.version }}-windows
          path: INSTALL/ventoy-*windows*
          if-no-files-found: error

      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: ventoy-${{ steps.version.outputs.version }}-linux
          path: INSTALL/ventoy-*linux*
          if-no-files-found: error

      - name: Upload LiveCD package
        uses: actions/upload-artifact@v7
        with:
          name: ventoy-${{ steps.version.outputs.version }}-livecd
          path: INSTALL/ventoy-*livecd*
          if-no-files-found: error

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUM
          path: INSTALL/sha256.txt
          if-no-files-found: error

      # Always capture the build log, even when a prior step fails
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: DOC/build.log
          if-no-files-found: warn

      # ── GitHub Release (tag builds only) ──────────────────────────────────
      # Creates a draft release so you can review before publishing.

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Ventoy ${{ steps.version.outputs.version }}"
          body: |
            ## Ventoy ${{ steps.version.outputs.version }}

            Built from commit ${{ github.sha }}.

            ### Files
            | File | Description |
            |------|-------------|
            | `ventoy-*-windows.zip` | Windows installer |
            | `ventoy-*-linux.tar.gz` | Linux installer |
            | `ventoy-*-livecd.iso` | LiveCD ISO |
            | `sha256.txt` | SHA-256 checksums |

            > **Note:** EFI files in this build are **not signed** and require Secure Boot to be disabled.
          files: |
            INSTALL/ventoy-*windows*
            INSTALL/ventoy-*linux*
            INSTALL/ventoy-*livecd*
            INSTALL/sha256.txt
