if [ "$grub_platform" = "pc" ]; then
menuentry "Boot from host's first hard disk to start the boot manager" --class hdd {
set root=(hd0,1)
chainloader +1
boot
}

menuentry "Boot from host's second hard disk to start the boot manager" --class hdd {
set root=(hd1,1)
chainloader +1
boot
}

menuentry "Boot from host's third hard disk to start the boot manager" --class hdd {
set root=(hd2,1)
chainloader +1
boot
}

menuentry "Search for and boot Microsoft Windows system" --class nt6 {
if search -n -s -f /bootmgr; then
ntldr /bootmgr
elif search -n -s -f /ntldr; then
ntldr /ntldr
else
echo "Windows NOT found ..."
fi
}

menuentry "Find/boot grub4dos multi-function boot manager (grldr)" --class G4D {
if search -n -s -f /grldr; then
ntldr /grldr
else
echo "Grub4dos NOT found ..."
fi
}

menuentry "Start GRUB2 File Manager (/boot/grubfm.iso.gz)" --class g2fm {
if search -n -s -f /boot/grubfm.iso.gz; then
linux /boot/loadfm.gz
initrd /boot/grubfm.iso.gz
fi
}

menuentry "boot bypass passwords /boot/KONBOOT.IMG" --class dos {
if search -n -s -f /boot/KONBOOT.IMG; then
linux16  ($root)/boot/memdisk
initrd16 ($root)/boot/KONBOOT.IMG
fi
}

menuentry "Start Clover Boot Loader (Legacy)" --class clover{
if search -n -s -f /boot/boot0ss; then
chainloader /boot/boot0ss
fi
}

menuentry "Start Clover Boot Loader Alt (Legacy)" --class clovera{
if search -n -s -f /boot/boot7; then
chainloader /boot/boot7
fi
}

menuentry "Start Plop Boot Manager Six" --class plop{
if search -n -s -f /boot/pbm6; then
linux16 /boot/pbm6
fi
}

menuentry "Start XOR Boot Manager" --class xorboot{
if search -n -s -f /boot/xorboot.bin; then
chainloader /boot/xorboot.bin
fi
}

else
menuentry "Find Microsoft Windows System Boot (UEFI Mode)" --class nt6 {
if search -n -s -f /EFI/Microsoft/Boot/bootmgfw.efi; then
terminal_output  console
chainloader /EFI/Microsoft/Boot/bootmgfw.efi
boot
else
echo "Windows NOT found ..."
fi
}

menuentry "Find Boot Manager for System's Initial Boot (UEFI Mode)" --class uefi {
if search -n -s -f /efi/boot/boot${VTOY_EFI_ARCH}.efi; then
terminal_output  console
chainloader /efi/boot/boot${VTOY_EFI_ARCH}.efi
boot
else
echo "BOOTX64.EFI NOT found ..."
fi
}

menuentry "Find/Boot grub4dos (UEFI Mode)" --class g4d-uefi {
if search -n -s -f /efi/boot/g4dos${VTOY_EFI_ARCH}.EFI; then
terminal_output  console
chainloader /efi/boot/g4dos${VTOY_EFI_ARCH}.EFI
boot
else
echo "g4dos${VTOY_EFI_ARCH}.EFI NOT found ..."
fi
}

menuentry "GRUB2 File Manager - Start GRUB2-based file manager (UEFI mode)" --class g2fm{
if search -n -s -f /EFI/boot/grubfm${VTOY_EFI_ARCH}.efi; then
chainloader /EFI/boot/grubfm${VTOY_EFI_ARCH}.efi
fi
}

menuentry "Start rEFInd Multisystem Boot Manager utility" --class refind{
if search -n -s -f /EFI/refind/refind_${VTOY_EFI_ARCH}.efi; then
chainloader /efi/refind/refind_${VTOY_EFI_ARCH}.efi
fi
}

menuentry "Boot Clover EFI bootloader" --class Clover{
if search -n -s -f /EFI/CLOVER/CLOVER${VTOY_EFI_ARCH}.EFI; then
chainloader /EFI/CLOVER/CLOVER${VTOY_EFI_ARCH}.EFI
fi
}

menuentry "Boot The Plop Boot Manager Six (EFI)" --class plop-efi{
if search -n -s -f /EFI/BOOT/pbm6-x64.efi; then
chainloader /EFI/BOOT/pbm6-x64.efi
fi
}
fi
fi

menuentry "<-- Return to previous menu [Esc]" --class=vtoyret VTOY_RET {
echo 'Return ...'
}